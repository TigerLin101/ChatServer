# ============================================================
# 集群聊天服务器 TCP 负载均衡配置(stream 模块)
#
# 用途: 客户端连 nginx 的 8000 端口,由 nginx 转发到后端多台 ChatServer
# 当前: 单机模拟三台服务器(用三个不同端口区分)
#
# 生效方式(二选一):
#   方式1: 把下面整个 stream { } 块复制进 /etc/nginx/nginx.conf 末尾
#   方式2: 在 /etc/nginx/nginx.conf 里加一行:
#          include /home/fx/c++集群服务器/nginx/stream.conf;
#          (注意: nginx 默认以 www-data 用户运行,需保证它能读这个文件)
# ============================================================

stream {
    # ---- 后端 ChatServer 集群 ----
    upstream chat_servers {
        # 负载均衡策略(默认轮询,下面三种可选一种):
        # least_conn;            # 分给当前连接数最少的那台
        # hash $remote_addr;     # 同一个客户端固定连同一台(长连接推荐)

        server 127.0.0.1:6000;   # 服务器1
        server 127.0.0.1:6001;   # 服务器2
        server 127.0.0.1:6002;   # 服务器3
    }

    # ---- nginx 对外提供的入口 ----
    server {
        listen 8000;                 # 客户端统一连这个端口
        proxy_pass chat_servers;     # 转发到 upstream 里的三台服务器
        proxy_connect_timeout 5s;    # 连接后端超时时间(秒)
    }
}
